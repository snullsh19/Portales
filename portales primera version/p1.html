<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Web - Shuha Emilio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos generales */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #E2EFF5;
            color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilos de la vista principal */
        #inicio {
            width: 100%;
            max-width: 900px;
            display: block;
        }

        /* Navegación (Navbar) */
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            margin-bottom: 40px;
        }

        button {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            background-color: #cedee6;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            color: #66757d;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #b5cdd8;
        }

        /* Presentación (Títulos) */
        .presentacion {
            text-align: left;
            padding: 0 40px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 1.2em;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 50px;
        }

        /* Contenedor de imágenes */
        .imagenes-container {
            display: flex;
            justify-content: space-around;
            padding: 0 20px;
            gap: 20px;
        }

        .imagenes-container img {
            width: 45%;
            border-radius: 5px;
            object-fit: cover;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Estilos de las vistas secundarias */
        .vista-secundaria {
            display: none; /* Ocultas por defecto */
            text-align: center;
            margin-top: 100px;
        }

        .vista-secundaria h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .btn-retorno {
            background-color: #a4bcc9;
            color: #333;
            font-size: 1.1em;
            padding: 12px 25px;
        }
    </style>
</head>
<body>

    <div id="inicio">
        <nav>
            <button onclick="navegar('inicio')">INICIO</button>
            <button onclick="navegar('informacion')">MI INFORMACIÓN</button>
            <button onclick="navegar('proyectos')">MIS PROYECTOS</button>
            <button onclick="navegar('contactos')">MIS CONTACTOS</button>
        </nav>

        <div class="presentacion">
            <h1>Hola!, Soy Shuha Emilio</h1>
            <h2>Desarrollar de software y proyectos mecatrónicos</h2>
        </div>

        <div class="imagenes-container">
            <img src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=500&auto=format&fit=crop" alt="Desarrollo de Software">
            <img src="https://images.unsplash.com/photo-1631541909061-71e34ddf4875?w=500&auto=format&fit=crop" alt="Impresión 3D">
        </div>
    </div>

    <div id="informacion" class="vista-secundaria">
        <h1>MI INFORMACIÓN</h1>
        <button class="btn-retorno" onclick="navegar('inicio')">Regresar a Inicio</button>
    </div>

    <div id="proyectos" class="vista-secundaria">
        <h1>MIS PROYECTOS</h1>
        <button class="btn-retorno" onclick="navegar('inicio')">Regresar a Inicio</button>
    </div>

    <div id="contactos" class="vista-secundaria">
        <h1>MIS CONTACTOS</h1>
        <button class="btn-retorno" onclick="navegar('inicio')">Regresar a Inicio</button>
    </div>

    <script>
        function navegar(idVistaDestino) {
            // Ocultar todas las vistas
            document.getElementById('inicio').style.display = 'none';
            document.getElementById('informacion').style.display = 'none';
            document.getElementById('proyectos').style.display = 'none';
            document.getElementById('contactos').style.display = 'none';

            // Mostrar solo la vista seleccionada
            document.getElementById(idVistaDestino).style.display = 'block';
        }
    </script>
</body>
</html>
